name: Build Android app

# Builds the Ironday Android app (APK) and publishes it as a GitHub Release download.
# Run it from the Actions tab: "Build Android app" > "Run workflow", and enter a version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, for example 1.0.0
        required: true
        default: 1.0.0

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ironday.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ironday.p12" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. Building a test APK signed with a temporary key."
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "$SIGNED" = "yes" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../ironday.apk
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../ironday.apk
          fi
          ls -la ../ironday.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          NOTE="Signed release."
          [ "$SIGNED" = "no" ] && NOTE="Test build signed with a temporary key. Uninstall it before installing a later signed version."
          cat > notes.md <<EOF
          ## Ironday ${{ inputs.version }} for Android

          **Install:** download \`ironday.apk\` below on your Android phone, open it, and allow installing from your browser if Android asks.

          **iPhone:** open https://jasperolino.github.io/ironday/ in Safari, tap Share, then Add to Home Screen.

          ${NOTE}
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ironday.apk --clobber
          else
            gh release create "$TAG" ironday.apk --title "Ironday ${{ inputs.version }}" --notes-file notes.md --target "$GITHUB_SHA"
          fi
